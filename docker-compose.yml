services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      # Để trống → chế độ offline. VD: LLM_PROVIDER=google_genai, LLM_MODEL=gemini-2.0-flash
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./eval/results:/app/eval/results
      - ./data/demo_cache:/app/data/demo_cache
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    profiles: ["eval"]
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns
    ports: ["5000:5000"]
    volumes: ["./mlruns:/mlruns"]

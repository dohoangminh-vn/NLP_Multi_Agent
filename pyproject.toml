[project]
name = "multi-agent-cs-lesson-planner"
version = "0.1.0"
description = "Hệ thống Multi-Agent hỗ trợ giáo viên thiết kế kế hoạch bài dạy Tin học 10 THPT chuẩn Công văn 5512"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pypdf>=5.0.0",
    "qdrant-client>=1.12.0",
]

[project.optional-dependencies]
rag-full = [
    "docling>=2.0.0",
    "rank-bm25>=0.2.2",
    "pyvi>=0.1.1",
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
